<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../vendor/bootstrap-select/css/bootstrap-select.min.css">
    <link href="../css/theme.css" rel="stylesheet" type="text/css">
    <link href="../css/popup.css" rel="stylesheet" type="text/css">
    <title>qzone-archiver</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <script src="../vendor/jquery/jquery.min.js"></script>
    <script src="../vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../vendor/bootstrap-select/js/bootstrap-select.min.js"></script>
    <script src="../vendor/bootstrap-select/js/i18n/defaults-zh_CN.min.js"></script>
    <script src="../vendor/lodash/lodash.min.js"></script>
</head>

<body>
    <div class="popup-wrap">
        <div class="popup-brand">
            <img src="../img/icon-128.png" alt="logo">
            <span>qzone-archiver</span>
        </div>

        <div class="popup-info">
            <div class="popup-info-item">登录QQ：<span id="loginUin"></span></div>
            <div class="popup-info-item">备份QQ：<span id="targetUin"></span></div>
            <div class="popup-info-item">模式：<span id="userType"></span></div>
        </div>

        <div class="popup-section-label">备份模块</div>
        <div class="popup-modules">
            <label class="popup-module">
                <input type="checkbox" id="Messages" name="exportType" value="Messages" checked>
                <span>说说</span>
            </label>
            <label class="popup-module">
                <input type="checkbox" id="Blogs" name="exportType" value="Blogs" checked>
                <span>日志</span>
            </label>
            <label class="popup-module">
                <input type="checkbox" id="Diaries" name="exportType" value="Diaries" checked>
                <span>日记</span>
            </label>
            <label class="popup-module">
                <input type="checkbox" id="Photos" name="exportType" value="Photos" checked>
                <span>相册</span>
            </label>
            <label class="popup-module">
                <input type="checkbox" id="Videos" name="exportType" value="Videos" checked>
                <span>视频</span>
            </label>
            <label class="popup-module">
                <input type="checkbox" id="Boards" name="exportType" value="Boards" checked>
                <span>留言</span>
            </label>
            <label class="popup-module">
                <input type="checkbox" id="Friends" name="exportType" value="Friends" checked>
                <span>好友</span>
            </label>
            <label class="popup-module">
                <input type="checkbox" id="Favorites" name="exportType" value="Favorites" checked>
                <span>收藏</span>
            </label>
            <label class="popup-module">
                <input type="checkbox" id="Shares" name="exportType" value="Shares" checked>
                <span>分享</span>
            </label>
            <label class="popup-module">
                <input type="checkbox" id="Visitors" name="exportType" value="Visitors" checked>
                <span>访客</span>
            </label>
        </div>

        <div id="export_albums_div" class="popup-albums" style="display: none;">
            <label for="export_albums" class="popup-section-label">相册列表</label>
            <select id="export_albums" class="form-control selectpicker" data-header="选择备份相册" data-live-search="true" multiple title="请选择相册" data-live-search-placeholder="搜索相册" data-actions-box="true" data-selected-text-format="count > 3">
                <optgroup label="分类">
                    <option value="1">相册一</option>
                    <option value="2">相册二</option>
                    <option value="3">相册三</option>
                </optgroup>
            </select>
        </div>

        <div class="popup-tips">
            <span id="diaries_tip" class="popup-tip" style="display: none;">日记已开启独立密码认证，请先<a id='diaries_close' target="_blank">关闭</a></span>
            <span id="download_tools_tip" class="popup-tip">当前文件下载工具为
                <a id="download_tool_tip" class="download_tool_tip" href="javascript:void(0)" target="_blank">助手内部</a>
            </span>
            <span id="download_help_tip" class="popup-tip">
                <span id="download_help_reson">内部下载，限制较多已淘汰</span>， <a id='download_help_suggestion' class="download_tool" target="_blank">点击这里更换下载工具</a>
            </span>
        </div>

        <div class="popup-action">
            <button id="backup" type="button" class="btn btn-primary btn-block">开始备份</button>
        </div>
    </div>
    <script src="../js/utils.js"></script>
    <script src="../js/popup.js"></script>
</body>

</html>
