name: 功能建议
description: 新功能、体验改进或备份范围建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 issue，避免重复提议。涉及 QQ 空间接口能力的建议，请说明接口是否仍然可用。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 当前哪里不方便？希望达到什么效果？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 可以描述交互、页面或实现思路
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 已尝试的方法
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 备份任务 / 采集
        - 下载中心
        - 归档查看器
        - 界面与设置
        - 检查更新 / 发布
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue
          required: true
        - label: 该建议不包含真实用户隐私数据
          required: true
