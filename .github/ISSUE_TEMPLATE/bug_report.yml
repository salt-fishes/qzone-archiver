name: Bug 报告
description: 备份失败、界面异常、数据不对等问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先升级到最新版，并确认问题仍能复现。
        **请勿粘贴真实 QQ 号、Cookie、备份内容或含个人路径的完整日志。**
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置 / 检查更新页面显示版本，或安装包文件名
      placeholder: 例如 5.5.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 23H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动应用到出现问题的完整步骤
      placeholder: |
        1. 打开应用并扫码登录
        2. 新建任务，选择 ...
        3. 运行约 ... 后出现 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附脱敏截图；请删除 QQ 号、昵称、头像等个人信息
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志（脱敏）
      description: 设置 → 高级 → 打开日志目录，取 backup-<taskId>.log 或 main.log 的相关片段
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除真实 QQ 号、Cookie、备份内容与个人路径
          required: true
        - label: 我已确认使用的是最新版本
          required: true
