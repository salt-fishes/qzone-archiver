name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Config spec check
        working-directory: desktop
        run: node scripts/gen-engine-config.mjs --check
      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck
      - name: Lint
        working-directory: desktop
        run: npm run lint
      - name: Test
        working-directory: desktop
        run: npm run test
      - name: Build renderer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: desktop
        run: npm run build:renderer
