name: CI

# 扩展版质量门禁：Manifest V3 配置校验 + 离线档案浏览器（SPA）构建。
# 说明：扩展端无单测套件，主体是静态 JS；这里守住「清单合法」与「SPA 可构建」两条底线。
on:
  pull_request:
    branches: [extension, main]
  push:
    branches: [extension]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate manifest.json
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('src/manifest.json', 'utf8'));
            if (m.manifest_version !== 3) throw new Error('manifest_version 必须为 3');
            if (!m.version) throw new Error('manifest.json 缺少 version');
            if (!m.background || !m.background.service_worker) throw new Error('缺少 MV3 service_worker');
            const missing = [...(m.content_scripts || []).flatMap((cs) => [...(cs.js || []), ...(cs.css || [])])]
              .filter((p) => !fs.existsSync('src/' + p));
            if (missing.length) throw new Error('content_scripts 引用了不存在的文件:\n' + missing.join('\n'));
            console.log('manifest.json 校验通过，版本', m.version);
          "

      - name: Install SPA deps
        working-directory: src/spa
        run: npm install --no-audit --no-fund

      - name: Build SPA archive viewer
        working-directory: src/spa
        run: npm run build
