name: CI

# 质量门禁：push/PR 到 main 时跑配置一致性 + 类型检查 + lint + 单测 + 渲染层构建。
# 说明：用 npm install 而非 npm ci——lockfile 在 Windows 端生成，跨平台可选依赖
# （esbuild/rollup 的平台二进制）会被 npm 裁剪，npm ci 的严格校验在 Linux 上必挂。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Config spec check
        working-directory: desktop
        run: node scripts/gen-engine-config.mjs --check
      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck
      - name: Lint
        working-directory: desktop
        run: npm run lint
      - name: Test
        working-directory: desktop
        run: npm run test
      - name: Build renderer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: desktop
        run: npm run build:renderer
