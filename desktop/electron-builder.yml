appId: com.qzonearchiver.desktop
productName: QZoneArchiver
copyright: Copyright © 2026 qzone-archiver

directories:
  output: release
  buildResources: build

# 打包进应用的资源（渲染器产物位于 src/renderer/dist）
# 注意：src/shared/ipc-contract.mjs 被 main 与 preload 直接 import，
# 漏配会导致打包后 ERR_MODULE_NOT_FOUND（v4.6.0 便携版启动即崩的根因），
# 由 tests/unit/packaging.files-coverage.test.mjs 守住。
files:
  - src/main/**/*
  - src/preload/**/*
  - src/shared/**/*
  - src/engine/**/*
  - src/renderer/dist/**/*
  - assets/**/*
  - package.json

win:
  # 应用图标（v4.7）：此前未配置，exe / 快捷方式 / 任务栏都回落成 Electron 默认图标。
  # build/icon.png 由 scripts/gen-app-icon.mjs 生成（源图 src/main/icon.png 仅 128×128，
  # 低于 electron-builder 要求的 256×256），打包前自动重建。
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: QZoneArchiver
  # 安装向导 / 控制面板中的图标（NSIS 只接受 .ico，故用 gen-app-icon.mjs 生成的多尺寸 ico）
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}

# 免安装版（单文件自解压，解压即用）
portable:
  artifactName: ${productName}-${version}-portable.${ext}

# 中国镜像，避免 electron 二进制下载超时
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
